name: Build Windows EXEs

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ttkbootstrap pyinstaller

      - name: Build Pomogator Client EXE
        run: |
          pyinstaller --noconsole --onefile --name "Pomogator" pomogator_utp.py

      - name: Build Configurator Admin EXE
        run: |
          pyinstaller --noconsole --onefile --name "Configurator" configurator.py

      - name: Create Release and Upload EXEs
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/Pomogator.exe
            dist/Configurator.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
