name: Build and Release Windows EXE

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt pyinstaller

    - name: Build both EXEs with PyInstaller
      run: |
        pyinstaller --noconsole --onefile --collect-all ttkbootstrap pomogator_utp.py --name PomogatorUTP
        pyinstaller --noconsole --onefile --collect-all ttkbootstrap configurator.py --name Configurator

    - name: Publish Release with both EXEs
      uses: softprops/action-gh-release@v2
      with:
        files: |
          dist/PomogatorUTP.exe
          dist/Configurator.exe
        name: "Release ${{ github.ref_name }}"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
